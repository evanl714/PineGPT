<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoWriter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <h1 class="logo">CoWriter</h1>
    <p class="tagline">AI cowriting via OpenRouter</p>

    <section class="group">
      <label for="apiKey">OpenRouter API key</label>
      <div class="keyrow">
        <input type="password" id="apiKey" placeholder="sk-or-v1-..." autocomplete="off" spellcheck="false">
        <button id="showKey" type="button" title="Show/hide key">&#128065;</button>
      </div>
      <p class="hint">Stored only in this browser (localStorage). Get one at <a href="https://openrouter.ai/keys" target="_blank" rel="noreferrer">openrouter.ai/keys</a>.</p>
    </section>

    <section class="group">
      <label for="model">Model</label>
      <div class="keyrow">
        <input type="text" id="model" list="modelList" placeholder="anthropic/claude-sonnet-4.5" spellcheck="false">
        <button id="refreshModels" type="button" title="Fetch model list from OpenRouter">&#8635;</button>
      </div>
      <datalist id="modelList"></datalist>
      <p class="hint" id="modelHint">Type any OpenRouter model id, or press &#8635; to load the full list.</p>
    </section>

    <section class="group">
      <label for="temp">Temperature <span id="tempVal">0.8</span></label>
      <input type="range" id="temp" min="0" max="1.5" step="0.05" value="0.8">
    </section>

    <section class="group">
      <label for="styleNotes">Style notes</label>
      <textarea id="styleNotes" placeholder="Optional standing instructions, e.g.&#10;&#8226; Literary fiction, close third person, past tense&#10;&#8226; Dry humor, short sentences&#10;&#8226; Never use the word 'suddenly'"></textarea>
    </section>

    <section class="group grow">
      <label for="storyNotes">Story notes (always in context)</label>
      <textarea id="storyNotes" placeholder="Characters, setting, plot so far &#8212; facts the model should always know, even when the draft outgrows the context window."></textarea>
      <button id="btnSummarize" type="button" class="wide">&#10022; Summarize draft into notes</button>
    </section>

    <section class="group">
      <label for="ctxSize">Draft context per request</label>
      <select id="ctxSize">
        <option value="8000">Small &#8212; last ~1,500 words</option>
        <option value="24000">Medium &#8212; last ~4,500 words</option>
        <option value="60000">Large &#8212; last ~11,000 words</option>
        <option value="0">Entire draft</option>
      </select>
      <p class="hint" id="ctxMeter"></p>
    </section>

    <section class="group">
      <button id="download" type="button" class="wide">Download draft (.md)</button>
      <p class="hint">Draft autosaves to this browser. <kbd>Ctrl</kbd>+<kbd>Enter</kbd> continues, <kbd>Esc</kbd> dismisses a suggestion.</p>
    </section>
  </aside>

  <main class="main">
    <div class="toolbar">
      <button id="btnContinue" type="button" class="primary" title="Continue writing from the cursor (Ctrl+Enter)">&#9998; Continue</button>
      <span class="divider"></span>
      <span class="toolbar-label">Selection:</span>
      <button id="btnImprove" type="button" disabled>Improve</button>
      <button id="btnShorten" type="button" disabled>Shorten</button>
      <button id="btnExpand" type="button" disabled>Expand</button>
      <input type="text" id="customInstr" placeholder="Custom instruction for selection&#8230; e.g. 'make this angrier'">
      <button id="btnCustom" type="button" disabled>Apply</button>
      <span class="spacer"></span>
      <span id="wordCount" class="meta">0 words</span>
      <span id="saveState" class="meta"></span>
    </div>

    <div class="editor-wrap">
      <textarea id="editor" placeholder="Start writing&#8230;" spellcheck="true"></textarea>
    </div>

    <div id="panel" class="panel" hidden>
      <div class="panel-head">
        <span id="panelTitle">Suggestion</span>
        <button id="btnStop" type="button" hidden>&#9632; Stop</button>
      </div>
      <div id="panelBody" class="panel-body"></div>
      <div id="panelActions" class="panel-actions" hidden>
        <button id="btnAccept" type="button" class="primary">Accept</button>
        <button id="btnRetry" type="button">Retry</button>
        <button id="btnDiscard" type="button">Discard</button>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
